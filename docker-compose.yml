services:
  neo4j:
    image: neo4j:5.26-community
    container_name: expertisegraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/fulcrumgraph
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fulcrumgraph", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - expertise

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expertisegraph-backend
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: fulcrumgraph
      NEO4J_DATABASE: neo4j
      XAI_API_KEY: ${XAI_API_KEY:-${GROK_API_KEY:-}}
      GROK_API_KEY: ${GROK_API_KEY:-${XAI_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-grok-3-mini}
      TOKEN_CHUNK_SIZE: ${TOKEN_CHUNK_SIZE:-400}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-40}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
      - ./sample_docs:/app/sample_docs:ro
    networks:
      - expertise

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expertisegraph-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - expertise

volumes:
  neo4j_data:

networks:
  expertise:
    driver: bridge
